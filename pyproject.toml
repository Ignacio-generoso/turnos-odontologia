[project]
name = "turnos-odontologia"
version = "0.1.0"
description = "Sistema de gestión de turnos y agenda de pacientes para consultorios odontológicos en Argentina."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.6.0",
    "tzdata>=2024.1",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
